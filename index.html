<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoC Card Trade Manager - Phân Loại & Kéo Thả</title>
  <style>
    :root {
      --bg-color: #12141d;
      --card-bg: #1e2230;
      --accent-color: #ff9800;
      --accent-green: #4caf50;
      --text-color: #f1f5f9;
      --border-color: #333a4d;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: var(--accent-color);
      margin-bottom: 20px;
      font-size: 1.8rem;
    }

    /* Controls Bar */
    .controls-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      background: var(--card-bg);
      padding: 15px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      margin-bottom: 20px;
      align-items: center;
      justify-content: space-between;
    }

    .search-box {
      flex: 1;
      min-width: 220px;
    }

    input[type="text"] {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background-color: #0d0f17;
      color: var(--text-color);
      box-sizing: border-box;
    }

    .btn-group {
      display: flex;
      gap: 8px;
    }

    button {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s, background-color 0.2s;
    }

    button:hover { opacity: 0.85; }
    .btn-primary { background-color: var(--accent-color); color: #000; }
    .btn-success { background-color: var(--accent-green); color: #fff; }
    .btn-info { background-color: #2196f3; color: #fff; }
    .btn-danger { background-color: #f44336; color: #fff; }

    /* Card Palette / Bank */
    .bank-section {
      background: var(--card-bg);
      padding: 15px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      margin-bottom: 25px;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .bank-section.drag-over {
      border-color: #f44336;
      background-color: rgba(244, 67, 54, 0.1);
    }

    .bank-title {
      font-weight: bold;
      margin-bottom: 12px;
      color: #aaa;
      font-size: 0.9rem;
      text-transform: uppercase;
    }

    /* Tab Filter Styles */
    .category-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 15px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }

    .tab-btn {
      background: #161925;
      color: #aaa;
      border: 1px solid var(--border-color);
      padding: 8px 14px;
      font-size: 0.85rem;
      border-radius: 20px;
    }

    .tab-btn.active {
      background: var(--accent-color);
      color: #000;
      border-color: var(--accent-color);
    }

    .card-pool {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      min-height: 50px;
    }

    /* Cards (Image Style) */
    .coc-card {
      background: #2a3042;
      border: 2px solid var(--border-color);
      border-radius: 8px;
      padding: 6px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      cursor: grab;
      user-select: none;
      position: relative;
      width: 82px;
      height: 125px;
      box-sizing: border-box;
    }

    .coc-card:active { cursor: grabbing; }

    .coc-card img {
      max-width: 100%;
      max-height: 48px;
      object-fit: contain;
      margin-bottom: 4px;
      pointer-events: none;
    }

    .coc-card.duplicate {
      border-color: var(--accent-green);
      box-shadow: 0 0 8px rgba(76, 175, 80, 0.4);
    }

    .card-name {
      font-size: 0.68rem;
      text-align: center;
      color: #ccc;
      word-break: break-word;
      max-width: 100%;
      line-height: 1.1;
      pointer-events: none;
    }

    .card-badge {
      background: var(--accent-color);
      color: #000;
      font-size: 0.72rem;
      font-weight: bold;
      padding: 1px 5px;
      border-radius: 10px;
      position: absolute;
      top: -8px;
      right: -8px;
      pointer-events: none;
    }

    .card-badge.dup-badge {
      background: var(--accent-green);
      color: #fff;
    }

    /* Đẩy nút cộng trừ xuống sát đáy thẻ */
    .card-controls {
      display: flex;
      gap: 6px;
      margin-top: auto;
      padding-top: 2px;
    }

    .btn-qty {
      background: #111;
      color: #fff;
      border: 1px solid var(--border-color);
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      opacity: 0.8;
    }

    .btn-qty:hover { opacity: 1; background-color: var(--accent-color); color: #000; }

    /* Tier Rows */
    .tier-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .tier-row {
      display: flex;
      background: var(--card-bg);
      border-radius: 10px;
      border: 1px solid var(--border-color);
      overflow: hidden;
      min-height: 130px;
      transition: border-color 0.2s, opacity 0.2s;
    }

    .tier-row.dragging-row {
      opacity: 0.4;
    }

    .tier-row.row-drag-over {
      border: 2px dashed var(--accent-color);
      background-color: rgba(255, 152, 0, 0.05);
    }

    .tier-label {
      width: 180px;
      background: #161925;
      padding: 15px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 8px;
      border-right: 2px solid var(--border-color);
      flex-shrink: 0;
      cursor: grab;
    }

    .tier-label:active { cursor: grabbing; }

    .row-handle {
      font-size: 1.2rem;
      color: #666;
      user-select: none;
      line-height: 1;
    }

    .tier-label input {
      text-align: center;
      font-weight: bold;
      font-size: 1rem;
      background: transparent;
      border: 1px dashed transparent;
      color: var(--accent-color);
      width: 100%;
    }

    .tier-label input:hover, .tier-label input:focus {
      border-color: var(--border-color);
      background: #0d0f17;
    }

    .tier-dropzone-container {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    /* Bộ lọc mini riêng cho từng Nick */
    .tier-mini-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 8px 12px;
      background: rgba(0, 0, 0, 0.25);
      border-bottom: 1px solid var(--border-color);
    }

    .mini-tab {
      background: #11141f;
      color: #888;
      border: 1px solid var(--border-color);
      padding: 3px 10px;
      font-size: 0.75rem;
      border-radius: 12px;
      cursor: pointer;
    }

    .mini-tab.active {
      background: var(--accent-color);
      color: #000;
      border-color: var(--accent-color);
      font-weight: bold;
    }

    .tier-dropzone {
      flex: 1;
      padding: 12px 15px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: flex-start;
      background-color: rgba(0,0,0,0.1);
      min-height: 90px;
    }

    .tier-dropzone.drag-over {
      background-color: rgba(255, 152, 0, 0.1);
      border: 2px dashed var(--accent-color);
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <h1>⚔️ CoC Card Manager - Hình Ảnh 🛡️</h1>

  <!-- Controls -->
  <div class="controls-bar">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="🔍 Lọc theo tên thẻ (vd: Pekka, Dragon, Rồng)..." oninput="filterCards()">
    </div>
    <div class="btn-group">
      <button class="btn-primary" onclick="addAccount()">+ Thêm Nick</button>
      <button class="btn-success" onclick="exportJSON()">💾 Xuất JSON</button>
      <button class="btn-info" onclick="triggerImport()">📂 Nhập JSON</button>
      <input type="file" id="importInput" class="hidden" accept=".json" onchange="importJSON(event)">
    </div>
  </div>

  <!-- Kho Thẻ Mẫu -->
  <div class="bank-section" id="bankSection">
    <div class="bank-title">Kho Thẻ Mẫu (Kéo vào Nick để thêm / Kéo từ Nick trả về đây để trừ thẻ)</div>
    
    <!-- Tab Phân Loại Lính Tổng -->
    <div class="category-tabs" id="categoryTabs">
      <button class="tab-btn active" onclick="setCategory('all', this)">Tất cả</button>
      <button class="tab-btn" onclick="setCategory('elixir', this)">Lính thường</button>
      <button class="tab-btn" onclick="setCategory('dark_elixir', this)">Lính hắc tiên dược</button>
      <button class="tab-btn" onclick="setCategory('builder_base', this)">Lính đảo (Thợ xây)</button>
      <button class="tab-btn" onclick="setCategory('super_troop', this)">Lính huyền thoại (Super)</button>
    </div>

    <div class="card-pool" id="cardBank"></div>
  </div>

  <!-- Tier List Accounts -->
  <div class="tier-container" id="tierContainer"></div>

      { name: "Super Miner", category: "super_troop", img: "https://static.wikia.nocookie.net/clashofclans/images/b/b3/Avatar_Super_Miner.png/revision/latest/scale-to-width-down/137?cb=20221212211242" },
      { name: "Super Yeti", category: "super_troop", img: "https://static.wikia.nocookie.net/clashofclans/images/5/5f/Avatar_Super_Yeti.png/revision/latest/scale-to-width-down/137?cb=20250326100831" },
      { name: "Super Minion", category: "super_troop", img: "https://static.wikia.nocookie.net/clashofclans/images/b/be/Avatar_Super_Minion.png/revision/latest/scale-to-width-down/137?cb=20201013063740" },
      { name: "Super Hog Rider", category: "super_troop", img: "https://static.wikia.nocookie.net/clashofclans/images/c/c4/Avatar_Super_Hog_Rider.png/revision/latest/scale-to-width-down/137?cb=20230613002801" },
      { name: "Super Valkyrie", category: "super_troop", img: "https://static.wikia.nocookie.net/clashofclans/images/9/9e/Avatar_Super_Valkyrie.png/revision/latest/scale-to-width-down/137?cb=20201012035954" },
      { name: "Super Witch", category: "super_troop", img: "https://static.wikia.nocookie.net/clashofclans/images/1/18/Avatar_Super_Witch.png/revision/latest/scale-to-width-down/137?cb=20200913075918" },
      { name: "Ice Hound", category: "super_troop", img: "https://static.wikia.nocookie.net/clashofclans/images/b/b0/Avatar_Ice_Hound.png/revision/latest/scale-to-width-down/137?cb=20201207184828" },
      { name: "Super Bowler", category: "super_troop", img: "https://static.wikia.nocookie.net/clashofclans/images/3/39/Avatar_Super_Bowler.png/revision/latest/scale-to-width-down/137?cb=20211005090727" }
    ];

    let currentCategory = 'all';

    let draggedType = null;
    let draggedCard = null;
    let draggedAccIndex = null;

    let state = JSON.parse(localStorage.getItem('coc_trade_data_img')) || {
      accounts: [
        { id: "acc_1", name: "Nick Chính", filterCategory: "all", cards: { "PEKKA": 2, "Dragon": 1 } },
        { id: "acc_2", name: "Nick Phụ 1", filterCategory: "all", cards: { "Barbarian": 4, "PEKKA": 1 } }
      ]
    };

    function saveState() {
      localStorage.setItem('coc_trade_data_img', JSON.stringify(state));
    }

    function init() {
      renderBank();
      setupBankDropzone();
      renderTiers();
    }

    function setupBankDropzone() {
      const bankSec = document.getElementById('bankSection');
      
      bankSec.addEventListener('dragover', (e) => {
        if (draggedType === 'CARD' && draggedCard && draggedCard.fromAccId) {
          e.preventDefault();
          bankSec.classList.add('drag-over');
        }
      });

      bankSec.addEventListener('dragleave', () => {
        bankSec.classList.remove('drag-over');
      });

      bankSec.addEventListener('drop', (e) => {
        if (draggedType === 'CARD' && draggedCard && draggedCard.fromAccId) {
          e.preventDefault();
          bankSec.classList.remove('drag-over');

          const sourceAcc = state.accounts.find(a => a.id === draggedCard.fromAccId);
          if (sourceAcc && sourceAcc.cards[draggedCard.name]) {
            sourceAcc.cards[draggedCard.name]--;
            if (sourceAcc.cards[draggedCard.name] <= 0) {
              delete sourceAcc.cards[draggedCard.name];
            }
            saveState();
            renderTiers();
          }
        }
      });
    }

    function setCategory(category, btnElement) {
      currentCategory = category;
      document.querySelectorAll('#categoryTabs .tab-btn').forEach(b => b.classList.remove('active'));
      btnElement.classList.add('active');
      filterCards();
    }

    function setAccCategory(accId, category) {
      const acc = state.accounts.find(a => a.id === accId);
      if (acc) {
        acc.filterCategory = category;
        saveState();
        renderTiers();
      }
    }

    function renderBank() {
      const bank = document.getElementById('cardBank');
      bank.innerHTML = '';
      DEFAULT_CARDS.forEach(cardData => {
        const cardEl = createCardElement(cardData.name, cardData.img, cardData.category, null, false);
        bank.appendChild(cardEl);
      });
    }

    function renderTiers() {
      const container = document.getElementById('tierContainer');
      container.innerHTML = '';

      state.accounts.forEach((acc, index) => {
        if (!acc.filterCategory) acc.filterCategory = 'all';

        const row = document.createElement('div');
        row.className = 'tier-row';
        row.dataset.accId = acc.id;
        row.dataset.accIndex = index;
        row.draggable = true;

        row.addEventListener('dragstart', (e) => {
          if (e.target.closest('.tier-dropzone-container') || e.target.closest('.coc-card')) {
            return;
          }
          draggedType = 'ACCOUNT';
          draggedAccIndex = index;
          e.dataTransfer.setData('text/plain', 'account:' + index);
          row.classList.add('dragging-row');
        });

        row.addEventListener('dragend', () => {
          row.classList.remove('dragging-row');
          document.querySelectorAll('.tier-row').forEach(r => r.classList.remove('row-drag-over'));
        });

        row.addEventListener('dragover', (e) => {
          if (draggedType === 'ACCOUNT' && draggedAccIndex !== index) {
            e.preventDefault();
            row.classList.add('row-drag-over');
          }
        });

        row.addEventListener('dragleave', () => {
          if (draggedType === 'ACCOUNT') {
            row.classList.remove('row-drag-over');
          }
        });

        row.addEventListener('drop', (e) => {
          if (draggedType === 'ACCOUNT') {
            e.preventDefault();
            e.stopPropagation();
            row.classList.remove('row-drag-over');

            const targetIndex = index;
            if (draggedAccIndex !== null && draggedAccIndex !== targetIndex) {
              const movedAccount = state.accounts.splice(draggedAccIndex, 1)[0];
              state.accounts.splice(targetIndex, 0, movedAccount);
              saveState();
              renderTiers();
            }
          }
        });

        const label = document.createElement('div');
        label.className = 'tier-label';
        label.title = "Kéo để thay đổi thứ tự vị trí Nick";

        const handleIcon = document.createElement('span');
        handleIcon.className = 'row-handle';
        handleIcon.innerHTML = '⋮⋮';

        const input = document.createElement('input');
        input.value = acc.name;
        input.onchange = (e) => {
          acc.name = e.target.value;
          saveState();
        };

        const delBtn = document.createElement('button');
        delBtn.className = 'btn-danger';
        delBtn.style.padding = '4px 8px';
        delBtn.style.fontSize = '0.75rem';
        delBtn.innerText = 'Xóa Nick';
        delBtn.onclick = () => deleteAccount(index);

        label.appendChild(handleIcon);
        label.appendChild(input);
        label.appendChild(delBtn);

        const dropzoneContainer = document.createElement('div');
        dropzoneContainer.className = 'tier-dropzone-container';

        const miniTabs = document.createElement('div');
        miniTabs.className = 'tier-mini-tabs';
        
        const categories = [
          { id: 'all', label: 'Tất cả' },
          { id: 'elixir', label: 'Thường' },
          { id: 'dark_elixir', label: 'Hắc tiên' },
          { id: 'builder_base', label: 'Đảo' },
          { id: 'super_troop', label: 'Super' }
        ];

        categories.forEach(cat => {
          const miniBtn = document.createElement('button');
          miniBtn.className = `mini-tab ${acc.filterCategory === cat.id ? 'active' : ''}`;
          miniBtn.innerText = cat.label;
          miniBtn.onclick = () => setAccCategory(acc.id, cat.id);
          miniTabs.appendChild(miniBtn);
        });

        const dropzone = document.createElement('div');
        dropzone.className = 'tier-dropzone';
        dropzone.dataset.accId = acc.id;

        dropzone.addEventListener('dragover', handleCardDragOver);
        dropzone.addEventListener('dragleave', handleCardDragLeave);
        dropzone.addEventListener('drop', handleCardDrop);

        const searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();

        Object.keys(acc.cards).forEach(cardName => {
          const qty = acc.cards[cardName];
          if (qty > 0) {
            const cardData = DEFAULT_CARDS.find(c => c.name === cardName);
            if(cardData) {
              const matchesSearch = cardName.toLowerCase().includes(searchQuery);
              const matchesAccCat = (acc.filterCategory === 'all') || (cardData.category === acc.filterCategory);

              if (matchesSearch && matchesAccCat) {
                const cardEl = createCardElement(cardName, cardData.img, cardData.category, acc.id, true, qty);
                dropzone.appendChild(cardEl);
              }
            }
          }
        });

        dropzoneContainer.appendChild(miniTabs);
        dropzoneContainer.appendChild(dropzone);

        row.appendChild(label);
        row.appendChild(dropzoneContainer);
        container.appendChild(row);
      });
    }

    function createCardElement(cardName, imgSrc, category, accId, inTier = false, qty = 1) {
      const card = document.createElement('div');
      card.className = `coc-card ${qty > 1 ? 'duplicate' : ''}`;
      card.draggable = true;
      card.dataset.cardName = cardName;
      card.dataset.category = category;
      if (accId) card.dataset.fromAccId = accId;

      card.addEventListener('dragstart', handleCardDragStart);

      let innerHTML = `<img src="${imgSrc}" alt="${cardName}" onerror="this.onerror=null; this.src='https://via.placeholder.com/60?text=Coc';">`;
      innerHTML += `<span class="card-name">${cardName}</span>`;
      
      if (inTier) {
        innerHTML += `<span class="card-badge ${qty > 1 ? 'dup-badge' : ''}">x${qty}</span>`;
        innerHTML += `
          <div class="card-controls">
            <button class="btn-qty" onclick="changeQty('${accId}', '${cardName}', -1)">-</button>
            <button class="btn-qty" onclick="changeQty('${accId}', '${cardName}', 1)">+</button>
          </div>
        `;
      }

      card.innerHTML = innerHTML;
      return card;
    }

    function handleCardDragStart(e) {
      e.stopPropagation();
      draggedType = 'CARD';
      const cardEl = e.currentTarget; 

      draggedCard = {
        name: cardEl.dataset.cardName,
        fromAccId: cardEl.dataset.fromAccId || null
      };

      e.dataTransfer.setData('text/plain', cardEl.dataset.cardName); 
    }

    function handleCardDragOver(e) {
      if (draggedType === 'CARD') {
        e.preventDefault();
        e.currentTarget.classList.add('drag-over');
      }
    }

    function handleCardDragLeave(e) {
      if (draggedType === 'CARD') {
        e.currentTarget.classList.remove('drag-over');
      }
    }

    function handleCardDrop(e) {
      if (draggedType !== 'CARD') return;

      e.preventDefault();
      e.stopPropagation();

      const dropzone = e.currentTarget;
      dropzone.classList.remove('drag-over');

      const targetAccId = dropzone.dataset.accId;
      if (!targetAccId || !draggedCard) return;

      if (draggedCard.fromAccId === targetAccId) return;

      const cardName = draggedCard.name;
      const targetAcc = state.accounts.find(a => a.id === targetAccId);

      if (targetAcc) {
        targetAcc.cards[cardName] = (targetAcc.cards[cardName] || 0) + 1;
      }

      if (draggedCard.fromAccId) {
        const sourceAcc = state.accounts.find(a => a.id === draggedCard.fromAccId);
        if (sourceAcc && sourceAcc.cards[cardName]) {
          sourceAcc.cards[cardName]--;
          if (sourceAcc.cards[cardName] <= 0) {
            delete sourceAcc.cards[cardName];
          }
        }
      }

      saveState();
      renderTiers();
    }

    function changeQty(accId, cardName, delta) {
      const acc = state.accounts.find(a => a.id === accId);
      if (!acc) return;

      acc.cards[cardName] = (acc.cards[cardName] || 0) + delta;
      if (acc.cards[cardName] <= 0) delete acc.cards[cardName];

      saveState();
      renderTiers();
    }

    function addAccount() {
      const newId = 'acc_' + Date.now();
      state.accounts.push({
        id: newId,
        name: `Nick ${state.accounts.length + 1}`,
        filterCategory: 'all',
        cards: {}
      });
      saveState();
      renderTiers();
    }

    function deleteAccount(index) {
      if (confirm('Bạn có chắc muốn xóa Nick này không?')) {
        state.accounts.splice(index, 1);
        saveState();
        renderTiers();
      }
    }

    function filterCards() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const bankCards = document.querySelectorAll('#cardBank .coc-card');

      bankCards.forEach(card => {
        const name = card.dataset.cardName.toLowerCase();
        const category = card.dataset.category;

        const matchesQuery = name.includes(query);
        const matchesCategory = (currentCategory === 'all') || (category === currentCategory);

        if (matchesQuery && matchesCategory) {
          card.classList.remove('hidden');
        } else {
          card.classList.add('hidden');
        }
      });

      renderTiers();
    }

    function exportJSON() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `coc_cards_img_backup_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function triggerImport() {
      document.getElementById('importInput').click();
    }

    function importJSON(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const importedData = JSON.parse(e.target.result);
          if (importedData && Array.isArray(importedData.accounts)) {
            state = importedData;
            saveState(); 
            renderTiers();
            alert('Đã nhập dữ liệu thành công!');
          } else {
            alert('File JSON không đúng định dạng!');
          }
        } catch (err) {
          alert('Lỗi đọc file JSON!');
        }
      };
      reader.readAsText(file);
    }

    init();
  </script>
</body>
</html>
